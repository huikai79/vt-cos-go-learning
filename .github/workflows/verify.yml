                '目前不宣稱本站能提升一般數學能力',
                '本頁來源最後查核：2026-09-29'
              ]
            },
            {
              name: "r1-review-start",
              url: new URL(`r1-review-start.html?deploy=${deploySha}`, base),
              checks: [
                'go-r1-independent-content-review-v5',
                'fnv1a32-c34ef6a4',
                'href="r1-review.html"',
                '請先不要瀏覽本專案的 GitHub 原始碼庫'
              ]
            },
            {
              name: "lesson-content-review",
              url: new URL(`lesson-content-review.html?deploy=${deploySha}`, base),
              checks: [
                '19 課短講外部棋理審查',
                'lesson-content-review.js',
                '它不測學習者是否理解，也不證明學習成效',
                'go-independent-lesson-content-review-v1'
              ]
            },
            {
              name: "formal-teaching-evidence",
              url: new URL(`formal-teaching-evidence.html?deploy=${deploySha}`, base),
              checks: [
                '正式教學真人證據收集',
                'formal-teaching-evidence.js',
                'go-formal-teaching-evidence-v2',
                '三位 target novice usability',
                '這不是學習成效評量'
              ]
            },
            {
              name: "formal-teaching-candidate",
              url: new URL(`formal-teaching-candidate.json?deploy=${deploySha}`, base),
              checks: [
                '"candidateId": "formal-teaching-candidate-2026-10-01-b"',
                '"assetFingerprint": "fnv1a32-js16-a3d229c5"',
                'learner-flow-v56'
              ]
            },
            {
              name: "teaching-gate",
              url: new URL(`teaching-gate.json?deploy=${deploySha}`, base),
              checks: [
                '"formalTeachingCandidateId": "formal-teaching-candidate-2026-10-01-b"',
                '"formalTeachingCandidateFingerprint": "fnv1a32-js16-a3d229c5"',
                '"lessonContentReview": "awaiting_external_receipt"',
                '"lessonContentFingerprint": "fnv1a32-d1f8b40f"',
                '"noviceUsability": "not_tested"',
                '"accessibility": "not_tested"'
              ]
            }
          ];

          async function fetchWithRetry(target) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(target.url, {
                  redirect: "follow",
                  headers: { "cache-control": "no-cache" }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const body = await response.text();
                const missing = target.checks.filter((needle) => !body.includes(needle));
                if (missing.length === 0) {
                  console.log(`PASS: ${target.name} served from ${response.url}`);
                  return;
                }
                throw new Error(`missing markers: ${missing.join(" | ")}`);
              } catch (error) {
                lastError = error;
                console.error(`Attempt ${attempt}/12 failed for ${target.name}: ${error.message}`);
                if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 10000));
              }
            }
            throw lastError;
          }

          for (const target of targets) await fetchWithRetry(target);
          NODE


  served-pages-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - served-pages-content
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish machine-readable served-content status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVED_RESULT: ${{ needs.served-pages-content.result }}
        run: |
          set -euo pipefail
          state="failure"
          description="served-content gate failed or was skipped"
          if [ "$SERVED_RESULT" = "success" ]; then
            state="success"
            description="public Pages markers match pushed main"
          fi
          export state description
          payload="$(node -e 'console.log(JSON.stringify({state:process.env.state,target_url:process.env.GITHUB_SERVER_URL+"/"+process.env.GITHUB_REPOSITORY+"/actions/runs/"+process.env.GITHUB_RUN_ID,description:process.env.description,context:"verify/served-pages-content"}))')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

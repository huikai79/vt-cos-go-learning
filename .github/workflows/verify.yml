name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event ref
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Report runtime
        shell: bash
        run: |
          node --version
          git rev-parse HEAD
      - name: Run non-browser Node tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.cjs; do
            test_name="$(basename "$test_file")"
            if [ "$test_name" = "ui.test.cjs" ] || [ "$test_name" = "sgf-sabaki-oracle.test.cjs" ]; then
              continue
            fi
            node "$test_file"
          done
      - name: Rebuild deterministic R1 review bank
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-r1-review-bank.cjs
          git diff --exit-code -- r1-review-bank.js
      - name: Verify frozen formal teaching candidate
        shell: bash
        run: node formal-teaching-candidate.cjs
      - name: Verify teaching gate behavior
        shell: bash
        run: node teaching-gate-verify.cjs --report-only
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.cjs' \) -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

  sabaki-sgf-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event ref
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install pinned Sabaki SGF oracle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --omit=optional @sabaki/sgf@3.5.0 doken@1.0.0
      - name: Compare bounded parser with Sabaki SGF
        shell: bash
        run: node tests/sgf-sabaki-oracle.test.cjs

  windows-ui-and-boundary:
    runs-on: windows-latest
    steps:
      - name: Checkout exact event ref
        shell: pwsh
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$env:GITHUB_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report runtime
        shell: pwsh
        run: |
          node --version
          git rev-parse HEAD
      - name: Run file URL UI suite
        shell: pwsh
        run: |
          node tests/ui.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Edge smoke
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/ui-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit repository boundary
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/repository-boundary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  served-pages-content:
    if: ${{ github.event_name == 'push' }}
    needs:
      - node-contracts
      - sabaki-sgf-oracle
      - windows-ui-and-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pushed commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify served Pages content matches pushed History version
        shell: bash
        run: |
          set -euo pipefail
          PAGES_URL="$(node -p "require('./release-manifest.json').hosting.pagesUrl")"
          export PAGES_URL
          node <<'NODE'
          const base = new URL(process.env.PAGES_URL);
          const deploySha = process.env.GITHUB_SHA;
          const targets = [
            {
              name: "index",
              url: new URL(`index.html?deploy=${deploySha}`, base),
              checks: [
                'href="history.html"',
                '歷史與典故另外讀，不擋住你的學習主線'
              ]
            },
            {
              name: "history",
              url: new URL(`history.html?deploy=${deploySha}`, base),
              checks: [
                'history.css?v=history-explore-v3',
                '歷史探索 v3',
                '兩個 72 不能當成同一條歷史因果證據',
                '本頁來源最後查核：2026-09-27',
                'href="advanced.html">回進階訓練</a>'
              ]
            },
            {
              name: "r1-review-start",
              url: new URL(`r1-review-start.html?deploy=${deploySha}`, base),
              checks: [
                'go-r1-independent-content-review-v5',
                'fnv1a32-c34ef6a4',
                'href="r1-review.html"',
                '不要瀏覽本專案 repository'
              ]
            }
          ];

          async function fetchWithRetry(target) {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(target.url, {
                  redirect: "follow",
                  headers: { "cache-control": "no-cache" }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const body = await response.text();
                const missing = target.checks.filter((needle) => !body.includes(needle));
                if (missing.length === 0) {
                  console.log(`PASS: ${target.name} served from ${response.url}`);
                  return;
                }
                throw new Error(`missing markers: ${missing.join(" | ")}`);
              } catch (error) {
                lastError = error;
                console.error(`Attempt ${attempt}/12 failed for ${target.name}: ${error.message}`);
                if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 10000));
              }
            }
            throw lastError;
          }

          for (const target of targets) await fetchWithRetry(target);
          NODE

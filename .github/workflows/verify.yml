name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event ref
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Report runtime
        shell: bash
        run: |
          node --version
          git rev-parse HEAD
      - name: Run non-browser Node tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.cjs; do
            test_name="$(basename "$test_file")"
            if [ "$test_name" = "ui.test.cjs" ] || [ "$test_name" = "sgf-sabaki-oracle.test.cjs" ]; then
              continue
            fi
            node "$test_file"
          done
      - name: Rebuild deterministic R1 review bank
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-r1-review-bank.cjs
          git diff --exit-code -- r1-review-bank.js
      - name: Verify frozen formal teaching candidate
        shell: bash
        run: node formal-teaching-candidate.cjs
      - name: Verify teaching gate behavior
        shell: bash
        run: node teaching-gate-verify.cjs --report-only
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.cjs' \) -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done

  sabaki-sgf-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event ref
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install pinned Sabaki SGF oracle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --omit=optional @sabaki/sgf@3.5.0 doken@1.0.0
      - name: Compare bounded parser with Sabaki SGF
        shell: bash
        run: node tests/sgf-sabaki-oracle.test.cjs

  windows-ui-and-boundary:
    runs-on: windows-latest
    steps:
      - name: Checkout exact event ref
        shell: pwsh
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$env:GITHUB_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report runtime
        shell: pwsh
        run: |
          node --version
          git rev-parse HEAD
      - name: Run file URL UI suite
        shell: pwsh
        run: |
          node tests/ui.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse KataGo smoke scripts
        shell: pwsh
        run: |
          foreach ($script in @("tests/katago-bridge-smoke.ps1", "tests/katrain-katago-smoke.ps1", "tests/katrain-smoke-autodiscovery.test.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $script, $_.Message) }
              exit 1
            }
          }
      - name: Test KaTrain KataGo autodiscovery
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/katrain-smoke-autodiscovery.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Edge smoke
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/ui-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit repository boundary
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/repository-boundary.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  served-pages-content:
    if: ${{ github.event_name == 'push' }}
    needs:
      - node-contracts
      - sabaki-sgf-oracle
      - windows-ui-and-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pushed commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify served Pages content matches pushed History version
        shell: bash
        run: |
          set -euo pipefail
          PAGES_URL="$(node -p "require('./release-manifest.json').hosting.pagesUrl")"
          export PAGES_URL
          node <<'NODE'
          const base = new URL(process.env.PAGES_URL);
          const deploySha = process.env.GITHUB_SHA;
          const targets = [
            {
              name: "index",
              url: new URL(`index.html?deploy=${deploySha}`, base),
              checks: [
                'href="history.html"',
                'href="math.html"',
                'href="global-go-observatory.html">全球觀察</a>',
                '歷史與典故另外讀，不擋住你的學習主線',
                'styles.css?v=learner-flow-v56',
                'app.js?v=learner-flow-v56',
                '15 單元核心課程（參考）',
                'class="advanced-priority-label">目前紀錄與證據</div>',
                'id="advanced-evidence-brief"',
                'id="advanced-evidence-note"',
                'class="advanced-evidence-details"',
                '查看資料來源與診斷'
              ]
            },
            {
              name: "advanced",
              url: new URL(`advanced.html?deploy=${deploySha}`, base),
              checks: [
                '19×19 棋譜決策點複盤',
                'advanced-decision-review-tools.js?v=advanced-decision-review-r1-r7-v1',
                'advanced-decision-review-package.js?v=advanced-decision-review-r1-r7-v1',
                'advanced-decision-review-events.js?v=advanced-decision-review-v1',
                'advanced-decision-review.js?v=advanced-decision-review-r1-r7-v1',
                'advanced-decision-replay-events.js?v=advanced-decision-replay-v1',
                'advanced-decision-replay.js?v=advanced-decision-replay-v1',
                'advanced-comparable-position-contract.js?v=advanced-comparable-position-v1',
                'advanced-comparable-position-events.js?v=advanced-comparable-position-v1',
                'advanced-comparable-position.js?v=advanced-comparable-position-v1',
                'advanced-delayed-comparable-contract.js?v=advanced-delayed-comparable-v1',
                'advanced-delayed-comparable-events.js?v=advanced-delayed-comparable-v1',
                'advanced-delayed-comparable-policy.js?v=advanced-delayed-comparable-v1',
                'advanced-delayed-comparable-analysis.js?v=advanced-delayed-comparable-v1',
                'advanced-delayed-comparable.js?v=advanced-delayed-comparable-v1',
                'advanced-comparable-framework-v2.js?v=advanced-comparable-framework-v2',
                'advanced-comparable-events-v2.js?v=advanced-comparable-framework-v2',
                'advanced-comparable-analysis-v2.js?v=advanced-comparable-framework-v2',
                'advanced-delayed-comparable-events-v2.js?v=advanced-comparable-framework-v2',
                'advanced-delayed-comparable-policy-v2.js?v=advanced-comparable-framework-v2',
                'advanced-delayed-comparable-analysis-v2.js?v=advanced-comparable-framework-v2',
                'advanced-comparable-v2.js?v=advanced-comparable-framework-v2',
                'enclosure-capture-fixtures.js?v=enclosure-capture-fixtures-v1',
                'advanced-enclosure-comparable-contract.js?v=advanced-enclosure-comparable-v1',
                'advanced-enclosure-comparable-events.js?v=advanced-enclosure-comparable-v1',
                'advanced-enclosure-comparable-policy.js?v=advanced-enclosure-comparable-v1',
                'advanced-enclosure-comparable-analysis.js?v=advanced-enclosure-comparable-v1',
                'advanced-enclosure-comparable.js?v=advanced-enclosure-comparable-v1',
                'advanced-seven-day-comparable-contract.js?v=advanced-seven-day-comparable-v1',
                'advanced-seven-day-comparable-events.js?v=advanced-seven-day-comparable-v1',
                'advanced-seven-day-comparable-policy.js?v=advanced-seven-day-comparable-v1',
                'advanced-seven-day-comparable-analysis.js?v=advanced-seven-day-comparable-v1',
                'advanced-seven-day-comparable.js?v=advanced-seven-day-comparable-v1',
                'advanced-cross-family-analysis.js?v=advanced-cross-family-analysis-v1',
                'advanced-evidence-export.js?v=advanced-evidence-export-v4',
                'decision-comparison.js?v=decision-comparison-v1',
                '用 KataGo 再比較這兩手（選用）',
                '固定搜尋量下的估計',
                '同一個已看過的局面加入重做清單',
                '已看過的局面重做',
                '在不同盤面找出同一種立即危險',
                '只用於練習與流程檢查，不作正式能力評量',
                '延後全盤判斷',
                '至少 24 小時後才開放',
                '固定間隔的公開流程檢查',
                '第二種全盤判斷',
                '在不同盤面同時限制兩串棋',
                '完成前不會先告訴你手筋名稱',
                '這些公開題只作練習與流程檢查',
                '先切斷，再完成包圍吃子',
                '四個局面依固定順序開放',
                '七天後全盤判斷',
                '七天是目前固定基準',
                '不把原棋譜當唯一最佳手',
                '這盤棋要怎麼複盤？',
                '棋盤事件候選',
                '帶走／繼續這次複盤'
              ]
            },
            {
              name: "global-go-observatory",
              url: new URL(`global-go-observatory.html?deploy=${deploySha}`, base),
              checks: [
                'global-go-observatory.css?v=global-go-observatory-v2',
                '2025 歐洲 EGD 年度活躍棋手前 10 名',
                '以下不是排名',
                '馬來西亞',
                '現況未知',
                '資料查核：2026-09-28'
              ]
            },
            {
              name: "history",
              url: new URL(`history.html?deploy=${deploySha}`, base),
              checks: [
                'history.css?v=history-explore-v6',
                '歷史探索 v6',
                '兩個 72 不能當成同一條歷史因果證據',
                '132｜東漢望都',
                '1949 → 1989｜規則到近現代仍在成文化與修訂',
                '1933 → 1934｜規則沒換，布石觀念仍能劇烈改變',
                '目前查核範圍內，尚未確認可可靠重建的早期 17 路實戰局面',

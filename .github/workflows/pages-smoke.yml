name: pages-smoke

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed

permissions:
  contents: read

jobs:
  served-content:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed source commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$DEPLOY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Verify served Pages content
        shell: bash
        run: |
          set -euo pipefail
          PAGES_URL="$(node -p "require('./release-manifest.json').hosting.pagesUrl")"
          export PAGES_URL
          node <<'NODE'
          const base = new URL(process.env.PAGES_URL);
          const deploySha = process.env.DEPLOY_SHA;
          const targets = [
            {
              name: "index",
              url: new URL(`index.html?deploy=${deploySha}`, base),
              checks: [
                'href="history.html"',
                '歷史與典故另外讀，不擋住你的學習主線'
              ]
            },
            {
              name: "history",
              url: new URL(`history.html?deploy=${deploySha}`, base),
              checks: [
                'history.css?v=history-explore-v3',
                '歷史探索 v3',
                '兩個 72 不能當成同一條歷史因果證據',
                '本頁來源最後查核：2026-09-27',
                'href="advanced.html">回進階訓練</a>'
              ]
            }
          ];

          async function fetchWithRetry(target) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(target.url, {
                  redirect: "follow",
                  headers: { "cache-control": "no-cache" }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const body = await response.text();
                const missing = target.checks.filter((needle) => !body.includes(needle));
                if (missing.length === 0) {
                  console.log(`PASS: ${target.name} served from ${response.url}`);
                  return;
                }
                throw new Error(`missing markers: ${missing.join(" | ")}`);
              } catch (error) {
                lastError = error;
                console.error(`Attempt ${attempt}/6 failed for ${target.name}: ${error.message}`);
                if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }
            throw lastError;
          }

          for (const target of targets) await fetchWithRetry(target);
          NODE

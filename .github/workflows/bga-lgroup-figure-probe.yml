name: bga-lgroup-figure-probe

on:
  push:
    branches:
      - research/bga-lgroup-figure-probe-2026-09-29

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Install PDF tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Fetch official BGJ 116 PDF
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --user-agent "vt-cos-go-learning-reference-research/1.0"             "https://www.britgo.org/files/bgj/bgj116.pdf"             -o /tmp/bgj116.pdf
          echo "pdf_sha256=$(sha256sum /tmp/bgj116.pdf | awk '{print $1}')" >> "$GITHUB_ENV"
          pdfinfo /tmp/bgj116.pdf | sed -n '1,20p'

      - name: Locate L Group article candidate pages
        shell: bash
        run: |
          set -euo pipefail
          pages=$(pdfinfo /tmp/bgj116.pdf | awk '/^Pages:/ {print $2}')
          : > /tmp/candidates.txt
          mkdir -p /tmp/bga-probe
          for n in $(seq 1 "$pages"); do
            pdftotext -layout -f "$n" -l "$n" /tmp/bgj116.pdf /tmp/page.txt
            if grep -Eqi "Richard[[:space:]]+Hunter|Counting[[:space:]]+Libert|L[ -]?group|libert" /tmp/page.txt; then
              echo "$n" >> /tmp/candidates.txt
              echo "=== PDF page $n ==="
              grep -Ein -C 3 "Richard[[:space:]]+Hunter|Counting[[:space:]]+Libert|L[ -]?group|libert" /tmp/page.txt || true
              cp /tmp/page.txt "/tmp/bga-probe/page-$n.txt"
              pdftoppm -png -r 220 -f "$n" -l "$n" -singlefile                 /tmp/bgj116.pdf "/tmp/bga-probe/page-$n"
            fi
          done
          test -s /tmp/candidates.txt
          tr '\n' ',' < /tmp/candidates.txt | sed 's/,$//' | xargs -I{} echo "candidate_pdf_pages={}" >> "$GITHUB_ENV"

      - name: Record temporary artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bga-probe/provenance.txt <<EOF
          source=https://www.britgo.org/files/bgj/bgj116.pdf
          pdf_sha256=$pdf_sha256
          candidate_pdf_pages=$candidate_pdf_pages
          purpose=temporary reference-only human verification
          persisted_to_repo=false
          retention_days=1
          EOF

      - name: Upload temporary research artifact
        uses: actions/upload-artifact@v4
        with:
          name: bga-lgroup-figure-probe
          path: /tmp/bga-probe/
          retention-days: 1
          if-no-files-found: error
